name: publish

# Publishing is driven by tags: pushing v1.2.3 publishes 1.2.3 to nuget.org.
# workflow_dispatch is the manual escape hatch and takes the version explicitly.
#
# Authentication is trusted publishing, not a stored API key: nuget.org validates
# this workflow's OIDC token against a policy naming this repository and this file,
# then issues a key that lives for an hour. Renaming this file, or moving the job
# into a GitHub environment, breaks the policy match until the policy is updated.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.2.3)'
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # nuget.org hands out a short-lived publishing key in exchange for this job's
    # OIDC token, so id-token: write is what makes trusted publishing work at all.
    # Without it the token request fails quietly and the login step gets nothing.
    permissions:
      contents: read
      id-token: write

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      QUARTZ_MONGO_CONNECTION_STRING: mongodb://localhost:27017/quartz

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # The version arrives through the environment rather than being interpolated
      # into the script, so a crafted tag or input cannot inject shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid package version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/Quartz.Spi.MongoDbJobStore/Quartz.Spi.MongoDbJobStore.csproj
          -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      # Requested here rather than at the top of the job: the key nuget.org returns
      # lasts an hour and one OIDC token buys exactly one key, so it is fetched
      # immediately before the push that uses it.
      #
      # Pinned to the v1.2.0 commit rather than the v1 tag. This is the one step that
      # mints a credential able to publish under our account, and a moving tag is a
      # way to lose control of it. Dependabot watches the actions and will offer bumps.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # A .snupkg symbol package sitting next to the .nupkg is pushed along with it.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error
